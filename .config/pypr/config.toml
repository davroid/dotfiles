[pyprland]
hyprland_version = "0.57.2"
plugins = [
  "magnify",
  "wallpapers",
  "expose"
]

[expose]
include_special = true

[wallpapers]
path = "~/images/wallpapers/"
interval = 30
extensions = ["jpg", "jpeg", "png"]
recurse = true
command = 'awww img -t random "[file]"'
clear_command = "awww clear"
