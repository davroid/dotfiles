# Primary upstream: Cloudflare DNS-over-TLS.
#
# forward-first: no   - never fall back to local recursion. Unbound's
#                       recursion path uses plaintext port 53 to the root
#                       servers, which this network blocks (WARP only permits
#                       Cloudflare on 53), so it would just time out.
# The plaintext fallback lives in 20-forward-plain.conf and is activated by
# /usr/local/sbin/unbound-dns-fallback only while 853/tcp is unreachable.
#
# IPv4 only. A global IPv6 address exists only while WARP is up, and in Tor
# mode external IPv6 is dropped on purpose, so an IPv6 upstream blackholes
# every query that picks it until the resolver's timeout (8 s+ measured).
# The IPv4 forwarders reach Cloudflare in every mode.
forward-zone:
    name: "."
    forward-first: no
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
