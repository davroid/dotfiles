# Start the WARP daemon only after a usable network exists.
#
# Upstream warp-svc.service is ordered After=pre-network.target only, so it
# starts before wlan0 has a lease. The first network-change event then lands
# while the client is still initialising and it parks itself in
# Disconnected(Manual) with the firewall/routes torn down (traffic leaks).
[Unit]
After=NetworkManager-wait-online.service network-online.target unbound.service
Wants=NetworkManager-wait-online.service network-online.target unbound.service
