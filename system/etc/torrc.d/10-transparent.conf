# Installed by dotfiles/system/install.sh; rationale in docs/networking.md 10.8.
#
# Listeners used by `switch-vpn tor` (transparent proxy, fail-closed). They
# are installed unconditionally and are harmless in the other modes, so that
# changing modes never needs a tor restart -- bitcoind keeps its onion
# connections on 127.0.0.1:9050.
#
# TransPort: external TCP is redirected here by the `inet tor` nftables
#            table, which only exists while the tor mode is selected.
# DNSPort:   UDP/53 is redirected here so an app that ignores Unbound cannot
#            leak its DNS query to the ISP.
TransPort 127.0.0.1:9040
DNSPort 127.0.0.1:5353
# Fake range used for .onion names resolved through SOCKS (AutomapHostsOnResolve)
# and for transparent .onion connections. It is inside RFC1918 on purpose, so
# ordinary unicast routing carries it; the nftables table carves it out of the
# LAN exemption and sends it to TransPort.
VirtualAddrNetworkIPv4 10.192.0.0/10
AutomapHostsOnResolve 1
